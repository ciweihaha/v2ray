name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to main in quick succession must not race to move the
# floating ciweihaha/v2 tag, and a superseded PR run should stop
# instead of burning runner time. Pushes queue; PR runs cancel the
# previous in-progress run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    # The image ships xf.sh, so it must not be built or pushed while the
    # shell checks and drills fail.
    needs: shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        # The docker job runs on its own runner: without this step the
        # build would use build-push-action's implicit remote git
        # context instead of the code the shell job just checked.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        # Required for the linux/arm64 build below (xf.sh detects the
        # target arch via uname -m under emulation and downloads the
        # matching upstream zip).
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        # No registry write on pull requests: secrets are unavailable to
        # fork PRs (login would fail), and PR code must not move the
        # ciweihaha/v2 floating tag before it is merged.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: Set immutable tag suffix
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Build only on pull requests; push only on push/dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          # Multi-arch: xf.sh already supports arm64, so the image does
          # too (QEMU above emulates the arm64 build).
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ciweihaha/v2
            ciweihaha/v2:${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}

  # Static checks and drills for xf.sh. Runs on every push/PR, unlike the
  # docker job it does not build or push an image.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck, BusyBox and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck busybox-static unzip
      - name: Run shellcheck
        run: shellcheck xf.sh entrypoint.sh tests/drill.sh
      - name: Run drills
        run: bash tests/drill.sh
