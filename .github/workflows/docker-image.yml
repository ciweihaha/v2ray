name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        # No registry write on pull requests: secrets are unavailable to
        # fork PRs (login would fail), and PR code must not move the
        # ciweihaha/v2 floating tag before it is merged.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: Set immutable tag suffix
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build only on pull requests; push only on push/dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ciweihaha/v2
            ciweihaha/v2:${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}

  # Static checks and drills for xf.sh. Runs on every push/PR, unlike the
  # docker job it does not build or push an image.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck, BusyBox and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck busybox-static unzip
      - name: Run shellcheck
        run: shellcheck xf.sh tests/drill.sh
      - name: Run drills
        run: bash tests/drill.sh
